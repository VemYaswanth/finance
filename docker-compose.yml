services:
  financial-review:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-docker-repo}
    image: financial-review:${APP_VERSION:-local}
    container_name: financial-review
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:8000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      FIN_REVIEW_DATA_DIR: /app/data
      FIN_REVIEW_AI_CATEGORIZE: ${FIN_REVIEW_AI_CATEGORIZE:-0}
      FIN_REVIEW_AI_MODEL: ${FIN_REVIEW_AI_MODEL:-gpt-4.1-mini}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
