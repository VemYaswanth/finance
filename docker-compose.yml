services:
  financial-plaid:
    build:
      context: .
      args:
        APP_VERSION: admin-screen-1
    container_name: financial-review-plaid
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FIN_REVIEW_AI_CATEGORIZE: ${FIN_REVIEW_AI_CATEGORIZE:-0}
      FIN_REVIEW_AI_MODEL: ${FIN_REVIEW_AI_MODEL:-gpt-4.1-mini}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
    volumes:
      - ./data:/app/data
